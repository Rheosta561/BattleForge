http:
  port: 8080
admin:
  port: 9876
  host: localhost
apiEndpoints:
  user-api:
    host: '*'
    paths:
      - '/users'
      - '/users/*'
      - '/health'
  auth-api:
    host: '*'
    paths:
      - '/auth/session'
    methods:
      - POST
  auth-refresh-api:
    host: '*'
    paths:
      - '/auth/refresh'
    methods:
      - POST
  auth-logout-api:
    host: '*'
    paths:
      - '/auth/logout'
    methods:
      - POST
  auth-me-api:
    host: '*'
    paths:
      - '/auth/me'
    methods:
      - GET
  # see: http://www.express-gateway.io/docs/configuration/gateway.config.yml/apiEndpoints
serviceEndpoints:
  # see: http://www.express-gateway.io/docs/configuration/gateway.config.yml/serviceEndpoints
  user-service:
    url: 'http://localhost:3000'
policies:
  - basic-auth
  - cors
  - expression
  - firebase-auth
  - key-auth
  - log
  - lagertha-auth
  - lagertha-session
  - oauth2
  - proxy
  - rate-limit
pipelines:
  # see: https://www.express-gateway.io/docs/configuration/gateway.config.yml/pipelines
  user-pipeline:
    apiEndpoints:
      - user-api
    policies:
      - rate-limit:
          - action:
               max: 10
               windowMs: 60000
               delayAfter: 0
               delayMs: 0
               statusCode: 429
               headers: true
      - log:
          - action:
              message : "${req.method} ${req.originalUrl}"
      - lagertha-auth:
          - action:
              publicPaths:
                - '/health'
      - firebase-auth:
          - action:
              # /users is protected by lagertha-auth; Firebase ID tokens are
              # verified by lagertha-session when establishing an app session.
              publicPaths:
                - '/health'
                - '/users'
                - '/users/*'
      - proxy:
          - action:
              serviceEndpoint: user-service
  auth-session-pipeline:
    apiEndpoints:
      - auth-api
    policies:
      - rate-limit:
          - action:
               max: 10
               windowMs: 60000
               delayAfter: 0
               delayMs: 0
               statusCode: 429
               headers: true
      - log:
          - action:
              message: "${req.method} ${req.originalUrl}"
      - lagertha-session:
          - action: {}
  auth-refresh-pipeline:
    apiEndpoints:
      - auth-refresh-api
    policies:
      - rate-limit:
          - action:
               max: 10
               windowMs: 60000
               delayAfter: 0
               delayMs: 0
               statusCode: 429
               headers: true
      - log:
          - action:
              message: "${req.method} ${req.originalUrl}"
      - lagertha-session:
          - action:
              action: refresh
  auth-logout-pipeline:
    apiEndpoints:
      - auth-logout-api
    policies:
      - rate-limit:
          - action:
               max: 10
               windowMs: 60000
               delayAfter: 0
               delayMs: 0
               statusCode: 429
               headers: true
      - log:
          - action:
              message: "${req.method} ${req.originalUrl}"
      - lagertha-session:
          - action:
              action: logout
  auth-me-pipeline:
    apiEndpoints:
      - auth-me-api
    policies:
      - rate-limit:
          - action:
               max: 10
               windowMs: 60000
               delayAfter: 0
               delayMs: 0
               statusCode: 429
               headers: true
      - log:
          - action:
              message: "${req.method} ${req.originalUrl}"
      - lagertha-auth:
          - action: {}
      - lagertha-session:
          - action:
              action: me